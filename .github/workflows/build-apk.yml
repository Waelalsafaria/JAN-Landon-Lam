name: Build Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk aljana-1234-levels.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aljana-1234-levels-apk
          path: aljana-1234-levels.apk
      - name: Publish APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${GITHUB_RUN_NUMBER}" aljana-1234-levels.apk --title "الجنة 1234 Levels" --notes "Android APK" --latest
